<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PageMind</title>
<link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div id="settingsOverlay" class="overlay hidden"></div>

  <div id="settingsPanel" class="settings-panel hidden">
    <div class="settings-header">
      <h2>Settings</h2>
      <button id="closeSettings" class="icon-btn">&times;</button>
    </div>
    <div class="settings-body">
      <label>API Key
        <input type="password" id="apiKey" placeholder="sk-... or gsk_..." />
      </label>
      <label>API Base URL
        <input type="text" id="baseUrl" placeholder="https://api.openai.com/v1/chat/completions" />
      </label>
      <label>Model
        <input type="text" id="model" placeholder="gpt-4o-mini" />
      </label>
      <hr/>
      <h3>Backend (optional)</h3>
      <label>Backend URL
        <input type="text" id="backendUrl" placeholder="http://localhost:3000" />
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="useBackend" />
        Use backend for proxy &amp; sync
      </label>
      <button id="saveSettings" class="btn-primary">Save</button>
      <p id="settingsStatus" class="hint"></p>
    </div>
  </div>

  <div id="app">
    <header class="header">
      <div class="header-top">
        <h1>PageMind</h1>
        <div class="header-actions">
          <button id="refreshBtn" class="icon-btn" title="Re-read this page">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
          </button>
          <button id="openSettings" class="icon-btn" title="Settings">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="page-info">
        <span class="page-dot" id="pageDot"></span>
        <span id="pageIndicator" class="page-indicator">Not read</span>
        <span id="tabIdDisplay" class="tab-id-badge"></span>
      </div>
    </header>

    <div id="messages" class="messages">
      <div class="welcome">
        <p>Open this panel on any page<br/>and ask me anything about it.</p>
      </div>
    </div>

    <div class="input-area">
      <textarea
        id="input"
        rows="1"
        placeholder="Ask about this page..."
      ></textarea>
      <button id="sendBtn" class="send-btn" disabled title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
